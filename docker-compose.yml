services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dolphin_erp
      POSTGRES_USER: dolphin
      POSTGRES_PASSWORD: dolphin
    ports:
      - "5432:5432"
    volumes:
      - dolphin-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dolphin_erp;Username=dolphin;Password=dolphin
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - "5154:8080"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./apps/dolphin-web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  dolphin-postgres:
