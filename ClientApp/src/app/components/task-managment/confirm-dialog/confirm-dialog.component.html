<div class="delete-dialog-wrapper">
  <div class="dialog-header">
    <mat-icon class="warn-icon">warning_amber</mat-icon>
    <h3 class="font-display">Confirm Deletion</h3>
  </div>
  <mat-dialog-content>
    <p class="delete-message">Are you sure you want to delete this task? This action cannot be undone.</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button mat-dialog-close class="btn-cancel">Cancel</button>
    <button mat-flat-button color="warn" (click)="onConfirm()" class="btn-delete">Confirm</button>
  </mat-dialog-actions>
</div>
