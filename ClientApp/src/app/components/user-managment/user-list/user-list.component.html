<div class="users-container glass-panel">
  <div class="header-toolbar">
    <div class="title-group">
      <h2 class="font-display">User Management</h2>
      <p class="subtitle">Platform accounts, credentials, and tenant role assignments</p>
    </div>
    <div class="action-group">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search User</mat-label>
        <input matInput (input)="applyFilter($event)" placeholder="Filter by name or email">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-flat-button color="primary" class="btn-add" (click)="addUser()">
        <mat-icon>person_add</mat-icon>
        <span>Add User</span>
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <mat-table [dataSource]="dataSource" matSort>
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
        <mat-cell *matCellDef="let user">
          <div class="user-name-cell">
            <app-dolphin-bridge-avatar [name]="user.name" presence="office" size="sm"></app-dolphin-bridge-avatar>
            <strong>{{ user.name }}</strong>
          </div>
        </mat-cell>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Email</mat-header-cell>
        <mat-cell *matCellDef="let user">
          <span class="user-email">{{ user.email }}</span>
        </mat-cell>
      </ng-container>

      <!-- Role Column -->
      <ng-container matColumnDef="role">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Assigned Role</mat-header-cell>
        <mat-cell *matCellDef="let user">
          <span class="role-badge">{{ user.role || 'Admin' }}</span>
        </mat-cell>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef class="actions-header">Actions</mat-header-cell>
        <mat-cell *matCellDef="let user" class="actions-cell">
          <button mat-icon-button color="primary" (click)="editUser(user)" title="Edit User">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser(user)" title="Delete User">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
  </div>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</div>
