<div class="login-wrapper">
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <div class="login-card">
    <div class="card-header">
      <div class="brand-badge">
        <mat-icon class="brand-icon">space_dashboard</mat-icon>
        <span class="brand-title">Dolphin</span>
      </div>
      <h1 class="welcome-title">Enterprise Suite</h1>
      <p class="welcome-sub">Sign in to access unified ERP, HRMS, and Agile Workspace</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-danger d-flex align-items-center mb-3">
        <mat-icon class="me-2 text-danger">error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>Work Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="name&#64;company.com" autocomplete="username">
        <mat-icon matPrefix class="me-2 text-muted">mail_outline</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" autocomplete="current-password">
        <mat-icon matPrefix class="me-2 text-muted">lock_outline</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Tenant Slug</mat-label>
        <input matInput formControlName="tenant" placeholder="demo">
        <mat-icon matPrefix class="me-2 text-muted">business</mat-icon>
        <mat-hint>Default organization: <strong>demo</strong></mat-hint>
      </mat-form-field>

      <div class="action-stack">
        <button mat-flat-button color="primary" type="submit" class="btn-submit" [disabled]="isLoading || loginForm.invalid">
          @if (isLoading) {
            <span>Signing in...</span>
          } @else {
            <span>Sign In</span>
          }
        </button>

        <div class="divider">
          <span>OR</span>
        </div>

        <button mat-stroked-button type="button" class="btn-demo" (click)="onQuickDemoLogin()" [disabled]="isLoading">
          <mat-icon class="me-1 text-primary">bolt</mat-icon>
          <span>One-Click Demo Sign-In (Admin)</span>
        </button>
      </div>
    </form>

    <div class="demo-hints">
      <div class="hint-item">
        <mat-icon>key</mat-icon>
        <span>admin&#64;dolphin.local &bull; Admin&#64;12345</span>
      </div>
    </div>
  </div>
</div>
