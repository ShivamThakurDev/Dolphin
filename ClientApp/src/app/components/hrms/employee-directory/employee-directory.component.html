<div class="hrms-container glass-panel">
  <div class="header-toolbar">
    <div class="title-group">
      <div class="header-icon-wrap">
        <mat-icon>badge</mat-icon>
      </div>
      <div>
        <h2 class="font-display">Employee Directory</h2>
        <p class="subtitle">Multi-tenant workforce directory and profile records</p>
      </div>
    </div>
    <div class="search-box">
      <mat-form-field appearance="outline">
        <mat-label>Search employee</mat-label>
        <input matInput (input)="applyFilter($event)" placeholder="Filter by name, code or email">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
  </div>

  <div class="table-responsive">
    <mat-table [dataSource]="dataSource" matSort class="spatial-table">
      <ng-container matColumnDef="employeeCode">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Code</mat-header-cell>
        <mat-cell *matCellDef="let emp">
          <span class="badge-code">{{ emp.employeeCode }}</span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Full Name</mat-header-cell>
        <mat-cell *matCellDef="let emp">
          <div class="emp-name-cell">
            <app-dolphin-bridge-avatar
              [name]="emp.fullName"
              [presence]="emp.status === 1 ? 'office' : 'remote'"
              size="sm">
            </app-dolphin-bridge-avatar>
            <strong class="emp-name-text">{{ emp.fullName }}</strong>
          </div>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="workEmail">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Work Email</mat-header-cell>
        <mat-cell *matCellDef="let emp">
          <span class="emp-email-text">{{ emp.workEmail }}</span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Status</mat-header-cell>
        <mat-cell *matCellDef="let emp">
          <span class="soft-badge" [class.badge-done]="emp.status === 1" [class.badge-conflict]="emp.status !== 1">
            {{ emp.status === 1 ? '🟢 Active' : '🟡 On Notice' }}
          </span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef class="actions-header">Actions</mat-header-cell>
        <mat-cell *matCellDef="let emp" class="actions-cell">
          <button mat-icon-button class="action-btn" color="primary" title="View details">
            <mat-icon>visibility</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;" class="spatial-table-row"></mat-row>
    </mat-table>
  </div>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</div>
